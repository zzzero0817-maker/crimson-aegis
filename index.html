<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CRIMSON AEGIS" />
  <title>CRIMSON AEGIS Ver.2.0</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="hudBox">
        <span class="label">SCORE</span>
        <span id="score">0</span>
      </div>
      <div class="hudBox hpBox">
        <span class="label">HP</span>
        <div id="hpBar"><div id="hpFill"></div></div>
      </div>
      <div class="hudBox"><span class="label">WAVE</span><span id="wave">1</span></div>
      <div class="hudBox"><span class="label">BEST</span><span id="bestScore">0</span></div>
    </div>

    <div id="startScreen" class="overlay">
      <div class="panel">
        <div class="version">PROJECT AEGIS / VER.2.0</div><h1>CRIMSON AEGIS</h1>
        <p>真紅のドローンで敵機を迎撃せよ</p>
        <button id="startBtn">MISSION START</button>
        <div class="settingsRow"><button id="soundBtn" class="subBtn">SOUND：ON</button><button id="resetBestBtn" class="subBtn">BEST RESET</button></div>
        <div class="help">
          <p>iPhoneは横向き推奨</p>
          <p>左下スティック：移動　右下FIRE：射撃</p>
        </div>
      </div>
    </div>

    <div id="rotateNotice">
      <div>iPhoneを横向きにしてください</div>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <div class="panel">
        <h2>MISSION FAILED</h2>
        <p>最終スコア：<span id="finalScore">0</span></p><p>最高スコア：<span id="finalBest">0</span></p>
        <button id="retryBtn">RETRY</button>
      </div>
    </div>

    <div id="touchControls">
      <div id="stickArea">
        <div id="stickBase"><div id="stickKnob"></div></div>
      </div>
      <button id="fireBtn">FIRE</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
